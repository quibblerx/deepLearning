defaults:
  - _self_

method: semi-supervised-ensemble

train:
  total_epochs: 250
  validation_interval: 10

init:
  _target_: trainer.SemiSupervisedEnsemble
  supervised_criterion:
    _target_: torch.nn.MSELoss
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 0.001
    weight_decay: 0.005
  scheduler:
    # _target_: torch.optim.lr_scheduler.StepLR
    # _partial_: true
    # step_size: 1
    # gamma: 0.975

    _target_: torch.optim.lr_scheduler.CosineAnnealingLR
    _partial_: true
    T_max: 250 # Matches your total_epochs: 250
    eta_min: 0.00001 # Minimum LR to drop to (can be 0.0 too)

  # Mean Teacher Semi-Supervised Learning Hyperparameters
  consistency_weight: 50.0 # Maximum weight for consistency loss
  consistency_rampup_epochs: 125 # Number of epochs to ramp up from 0 to max weight
  ema_decay: 0.99 # Exponential moving average decay rate for teacher model
